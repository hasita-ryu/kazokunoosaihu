function currentMovement(){if(page!=='home'&&page!=='savings')return null;let all=role==='parent'?state.movements.filter(m=>m.child==='parent'&&!m.seen):storedUnseen();if(page==='savings')all=all.filter(m=>m.kind==='save'||m.kind==='withdraw');if(!all.length)return null;const first=all.find(x=>x.id===movementFocusId)||all[0];const jarKind=first.kind==='save'||first.kind==='withdraw';const same=all.filter(x=>x.kind===first.kind&&(!jarKind||(first.jarId!=null?x.jarId===first.jarId:x.detail===first.detail))&&(role!=='parent'||x.detail===first.detail));return {kind:first.kind,ids:same.map(x=>x.id),amount:same.reduce((a,x)=>a+x.amount,0),count:same.length,detail:first.detail,jarId:first.jarId}}
function movementTypes(amount){let types=[];const notes=Math.min(2,Math.floor(amount/1000));for(let i=0;i<notes;i++)types.push('note');const remaining=amount-notes*1000;const coins=Math.min(3,Math.floor(remaining/100));for(let i=0;i<coins;i++)types.push('coin');if(!types.length)types.push('coin');return types}function movementMoney(amount){return movementTypes(amount).map((type,i)=>`<img class="flow-cash ${type}" src="${CASH_ART[type]}" alt="" style="--i:${i}">`).join('')}
function flowStore(){return `<svg class="flow-store" viewBox="0 0 120 110" aria-hidden="true"><path d="M17 43h86v58H17z" fill="#f6e2bc" stroke="#315c49" stroke-width="4" stroke-linejoin="round"/><path d="M10 39 25 14h70l15 25v12H10z" fill="#e8a76c" stroke="#315c49" stroke-width="4" stroke-linejoin="round"/><path d="M29 14 21 39M50 14l-3 25M70 14l3 25M91 14l8 25" stroke="#fff6e4" stroke-width="7"/><path d="M74 101V65h16v36" fill="#80a991" stroke="#315c49" stroke-width="3"/><rect x="29" y="62" width="32" height="23" rx="4" fill="#fffdf7" stroke="#315c49" stroke-width="3"/></svg>`}
function moneyOverlay(){const m=currentMovement();if(!m)return '';const jar=state.savings.find(j=>j.id===m.jarId&&j.child===getChild().id)||jarsFor().find(j=>j.title===m.detail)||jarsFor().find(j=>!j.opened);const jarPic=`<img class="flow-object" src="${ART[jar?.skin==='can'?'can':'pig']}" alt="貯金箱">`;const jarLabel=jar?esc(jar.title):'貯金箱';const childWallet=walletImg(walletSkinFor(),'flow-object'),parentWallet=walletImg('classic','flow-object');let from=parentWallet,to=childWallet,fromLabel='おうちの人',toLabel='自分のおさいふ',label='おこづかいを受け取ったよ！',mode='in';if(m.kind==='spend'){mode='out';from=role==='parent'?parentWallet:childWallet;fromLabel=role==='parent'?'保護者のおさいふ':'自分のおさいふ';if(role==='parent'&&/チャージ|報酬/.test(m.detail)){to=childWallet;toLabel='子どものおさいふ';label='お金を渡しました'}else if(m.detail==='残高引戻し'){to=parentWallet;toLabel='保護者のおさいふ';label='お金を戻しました'}else{to=flowStore();toLabel='お店';label='お金を使いました'}}else if(m.kind==='save'){mode='jar';from=childWallet;to=jarPic;fromLabel='自分のおさいふ';toLabel=jarLabel;label='貯金箱に入ったよ！'}else if(m.kind==='withdraw'){mode='withdraw';from=jarPic;to=childWallet;fromLabel=jarLabel;toLabel='自分のおさいふ';label='貯金箱を開けました'}else if(role==='parent'){to=parentWallet;toLabel='保護者のおさいふ';fromLabel='入金';label='お金が入りました'}return `<div class="move-overlay art-movement flow-overlay ${mode}" role="dialog" aria-label="${label}"><div class="move-panel"><h2>${label}</h2><div class="flow-scene" style="--last-cash:${movementTypes(m.amount).length-1}"><div class="flow-guide" aria-hidden="true"></div><div class="flow-endpoint source">${from}<span>${fromLabel}</span></div><div class="flow-endpoint destination">${to}<span>${toLabel}</span></div><div class="flow-particles" aria-hidden="true">${movementMoney(m.amount)}</div></div><div class="movement-amount">${yen(m.amount)}</div><p class="flow-note">お金の移動イメージ</p><button class="btn" id="movementok">確認する</button></div></div>`}
const getChild=()=>state.children.find(c=>c.id===state.selectedChild);const available=()=>state.subscription!=='cancelled';const uid=()=>++state.nextId;function note(text,r=role,childId=null){state.notifications.unshift({id:uid(),text,role:r,child:r==='child'?(childId??getChild().id):null,read:false})}function notify(t){toastText=t;render();setTimeout(()=>{if(toastText===t){toastText='';const toast=document.querySelector('.toast');if(toast)toast.remove()}},2800)}function go(p){if(p==='cash'){notify('現金はアプリ外で管理します');return;}if(p!=='savings'){jarOpenStep=0;jarOpenId=null;}if(!available()&&['missions','missionadd','proposaladd','proposals','ledger','ledgeradd'].includes(p)){notify('この機能は有料契約・無料トライアル中に利用できます');return}if(role==='child'&&['topup','transfer','refund','missionadd','children','cash'].includes(p)){notify('保護者専用の操作です');return}if(role==='parent'&&['proposaladd','spend','jarcreate'].includes(p)){notify('子ども専用の操作です');return}page=p;render()}function setrole(r){role=r;page='home';render()}function moneymove(amount,kind){if(role!=='parent')return notify('保護者専用の操作です');let ch=getChild();amount=Number(amount);if(!Number.isSafeInteger(amount)||amount<=0)return notify('1円以上の整数を入力してください');if(kind==='topup'&&(!Number.isSafeInteger(state.parentWallet+amount)))return notify('金額が上限を超えています');if(kind==='topup'){state.parentWallet+=amount;movement('income',amount,'parent','おさいふに入金');note(`おさいふに${yen(amount)}チャージしました`,'parent')}else if(kind==='transfer'){if(state.parentWallet<amount)return notify('おさいふ残高が不足しています');state.parentWallet-=amount;movement('spend',amount,'parent','子どものカードへチャージ');let saved=autoSaveIncome(ch,amount);state.transactions.unshift({id:uid(),type:'income',name:'チャージ',amount:amount-saved,date:today(),child:ch.id,origin:'card'});state.ledger.unshift({id:uid(),child:ch.id,name:'チャージ（使える分）',amount:amount-saved,date:today(),origin:'auto'});note(`${ch.name}さんに${yen(amount)}チャージしました`,'parent');note(`${yen(amount)}チャージされました${saved?'（うち'+yen(saved)+'を自動貯金）':''}`,'child',ch.id)}else if(kind==='refund'){if(ch.balance<amount)return notify('カード残高が不足しています');ch.balance-=amount;state.parentWallet+=amount;movement('spend',amount,ch.id,'残高引戻し');movement('income',amount,'parent','子どものカードから戻す');note(`${yen(amount)}をおさいふに引き戻しました`,'parent')}save();notify('処理が完了しました');go('home')}
function jarError(message){const error=document.getElementById('jar-error');if(error){error.textContent=message;error.hidden=false;error.setAttribute('role','alert')}else notify(message)}
function newJar(title,target,percent,want,skin){
  if(role!=='child')return jarError('子どもモードで作成してください。');
  title=String(title??'').trim();let rawTarget=String(target??'').trim(),rawPercent=String(percent??'').trim();
  if(!title)return jarError('貯金箱の名前を入力してください。');want=String(want??'').trim();if(!want)return jarError('欲しいものを入力してください。');if(want.length>80)return jarError('欲しいものは80文字以内にしてください。');
  if(title.length>60)return jarError('貯金缶の名前は60文字以内にしてください。');
  if(!rawTarget)return jarError('目標金額を入力してください。');
  const value=Number(rawTarget);
  if(!/^\d+$/.test(rawTarget)||!Number.isSafeInteger(value)||value<1)return jarError('目標金額は1円以上の整数で入力してください。');
  if(!rawPercent)return jarError('自動貯金の割合を入力してください。不要な場合は0を入力します。');
  const ratio=Number(rawPercent);
  if(!/^\d+$/.test(rawPercent)||!Number.isInteger(ratio)||ratio<0||ratio>100)return jarError('自動貯金の割合は0〜100の整数で入力してください。');
  const child=getChild();if(!child)return jarError('子どものアカウントを選び直してください。');
  const jar={id:uid(),child:child.id,title,want,skin:skin==='can'?'can':'pig',target:value,balance:0,percent:ratio,opened:false,created:today()};
  state.savings.unshift(jar);
  const persisted=save();
  page='savings';render();
  if(!state.savings.some(x=>x.id===jar.id)){notify('作成処理に失敗しました。');return}
  notify(persisted?'新しい貯金缶を作りました':'貯金缶を作成しました。ただし、このブラウザでは再読み込み後の保存ができません。');
}
function saveJarError(id,message){const el=document.querySelector(`[data-save-error="${id}"]`);if(el){el.textContent=message;el.hidden=false;el.setAttribute('role','alert')}else notify(message)}
function putJar(id,rawAmount){if(role!=='child')return saveJarError(id,'子どもモードから貯金してください');const ch=getChild(),j=state.savings.find(j=>j.id===id&&j.child===ch.id&&!j.opened);const raw=String(rawAmount??'').trim();if(!j)return saveJarError(id,'貯金箱が見つかりません。画面を開き直してください');if(!raw)return saveJarError(id,'貯金する金額を入力してください');const amount=Number(raw);if(!/^\d+$/.test(raw)||!Number.isSafeInteger(amount)||amount<=0)return saveJarError(id,'1円以上の整数で入力してください');if(ch.balance<amount)return saveJarError(id,`カードの残高は${yen(ch.balance)}です。残高以下の金額を入力してください`);if(j.balance+amount>j.target)return saveJarError(id,`目標まであと${yen(j.target-j.balance)}です。それ以下の金額を入力してください`);ch.balance-=amount;j.balance+=amount;if(j.balance>=j.target)awardPoints('jar:'+j.id,20,'貯金目標を達成');movementFocusId=movement('save',amount,ch.id,j.title,j.id);note(`${j.title}に${yen(amount)}貯金しました`,'parent');save();go('savings');notify(`${yen(amount)}を貯金しました。カード残高から移しました`)}
function changePercent(id,n){if(String(n).trim()==='')return notify('割合を入力してください');const j=state.savings.find(j=>j.id===id&&j.child===getChild().id&&!j.opened);n=Number(n);if(role!=='child'||!j||!Number.isInteger(n)||n<0||n>100)return notify('割合を確認してください');j.percent=n;save();notify('自動貯金の割合を変更しました')}
function startOpen(id){let j=state.savings.find(j=>j.id===id&&j.child===getChild().id&&!j.opened);if(role!=='child'||!j)return;jarOpenId=id;jarOpenStep=1;render()}
function openJarFinal(){const j=state.savings.find(j=>j.id===jarOpenId&&j.child===getChild().id&&!j.opened);if(!j||role!=='child'||jarOpenStep!==2)return;const ch=getChild();j.opened=true;j.openedAt=today();j.success=j.balance>=j.target;ch.balance+=j.balance;movementFocusId=movement('withdraw',j.balance,ch.id,j.title,j.id);note(`${ch.name}さんが貯金缶「${j.title}」を${j.success?'目標達成後':'途中で'}開けました`,'parent');jarOpenStep=0;jarOpenId=null;save();go('savings');notify('貯金缶を開け、貯金額をカード残高に戻しました')}
function autoSaveIncome(ch,amount){let jars=state.savings.filter(j=>j.child===ch.id&&!j.opened&&j.balance<j.target&&j.percent>0).sort((a,b)=>a.id-b.id);let remaining=amount;let saved=0;const allocations=[];for(const j of jars){const add=Math.min(Math.floor(amount*j.percent/100),j.target-j.balance,remaining);if(add>0){j.balance+=add;remaining-=add;saved+=add;allocations.push({j,add});if(j.balance>=j.target)awardPoints('jar:'+j.id,20,'貯金目標を達成')}}ch.balance+=remaining;movement('income',remaining,ch.id,'おこづかい');for(const {j,add} of allocations)movement('save',add,ch.id,j.title,j.id);return saved}
function spend(name,amount,category,showMovement=false){if(role!=='child')return notify('子ども専用の操作です');let ch=getChild();amount=Number(amount);if(!ch.active)return notify('カードが停止されています');if(!name.trim()||!Number.isSafeInteger(amount)||amount<=0)return notify('内容と正しい金額を入力してください');if(ch.balance<amount)return notify('カード残高が不足しています');ch.balance-=amount;const moveId=movement('spend',amount,ch.id,name);if(showMovement)movementFocusId=moveId;state.transactions.unshift({id:uid(),type:'spend',name,amount,date:today(),child:ch.id,category:normalizeCategory(category,name),origin:'card'});state.ledger.unshift({id:uid(),child:ch.id,name,amount:-amount,date:today(),category:normalizeCategory(category,name),origin:'auto'});note(`${ch.name}さんが${yen(amount)}を利用しました：${name}`,'parent');save();go(showMovement?'home':'ledger');if(!showMovement)notify('デモ決済を記録しました');return true}
function createMission(title,description,amount,source='parent'){if(role!=='parent'||!available())return notify('保護者の有料対象機能です');amount=Number(amount);if(!title.trim()||!description.trim()||!Number.isSafeInteger(amount)||amount<0)return notify('入力内容を確認してください');state.missions.unshift({id:uid(),title,description,reward:amount,child:getChild().id,status:'active',source});save();go('missions');notify('ミッションを登録しました')}
function finishMission(id){if(role!=='child')return notify('子ども専用の操作です');let m=state.missions.find(x=>x.id===id&&x.child===getChild().id);if(!m||m.status!=='active')return;if(!available())return notify('契約状態によりミッションを利用できません');if(state.parentWallet<m.reward)return notify('保護者のおさいふ残高が不足しています');let ch=state.children.find(x=>x.id===m.child);state.parentWallet-=m.reward;movement('spend',m.reward,'parent','ミッション報酬');ch.balance+=m.reward;movement('income',m.reward,ch.id,'ミッション報酬');m.status='done';state.ledger.unshift({id:uid(),child:ch.id,name:'ミッション報酬：'+m.title,amount:m.reward,date:today(),origin:'auto'});note(`${m.title}達成：${yen(m.reward)}をチャージ`,'parent');note(`${m.title}の報酬${yen(m.reward)}を受け取りました`,'child',ch.id);save();go('missions');notify('達成！報酬をチャージしました')}
function proposalError(message){const el=document.getElementById('proposalerror');if(el){el.textContent=message;el.hidden=false;el.setAttribute('role','alert');el.scrollIntoView({block:'nearest'});}else notify(message)}
function propose(title,description,reward,deadline){if(role!=='child')return proposalError('子どもモードから提案してください。');if(!available())return proposalError('現在の契約状態ではミッション提案を利用できません。設定で無料トライアルまたは有料契約にしてください。');let n=Number(reward);if(!title.trim())return proposalError('お仕事の名前を入力してください。');if(!description.trim())return proposalError('仕事内容を入力してください。');if(title.trim().length>70||description.trim().length>300)return proposalError('文字数が上限を超えています。');if(String(reward).trim()===''||!Number.isSafeInteger(n)||n<0)return proposalError('希望報酬は0以上の整数で入力してください。');if(deadline&&(!/^\d{4}-\d{2}-\d{2}$/.test(deadline)||!Number.isFinite(Date.parse(deadline+'T00:00:00'))||new Date(deadline+'T00:00:00').getDate()!==Number(deadline.slice(8))||deadline<today()))return proposalError('希望期限は今日以降を選択してください。');let ch=getChild();state.proposals.unshift({id:uid(),child:ch.id,title:title.trim(),description:description.trim(),reward:n,deadline,status:'pending',date:today()});note(`${ch.name}さんからミッション提案が届きました`,'parent');save();page='missions';missionTab='proposed';notify('保護者に提案しました。承認待ちです。')}
function judge(id,approve){if(role!=='parent'||!available())return notify('保護者の有料対象機能です');let p=state.proposals.find(x=>x.id===id);if(!p||p.status!=='pending')return;p.status=approve?'approved':'rejected';if(approve){state.missions.unshift({id:uid(),title:p.title,description:p.description,reward:p.reward,child:p.child,status:'active',source:'proposal',proposalId:p.id})}note(`ミッション「${p.title}」が${approve?'承認':'却下'}されました`,'child',p.child);save();go('proposals');notify(approve?'承認しました':'却下しました')}
function form(id,handler){let el=document.getElementById(id);if(!el)return;let submitting=false;el.addEventListener('submit',e=>{e.preventDefault();if(submitting)return;submitting=true;try{handler(new FormData(el))}catch(err){console.error('フォーム送信失敗',err);notify('処理に失敗しました。画面を再読み込みせず、もう一度操作してください。')}finally{queueMicrotask(()=>{submitting=false})}})}

const EXPENSE_CATEGORY_COLORS={
 'お菓子':'#E98B6D', '文房具':'#699CE0', '食べ物':'#E3AB50', '遊び':'#A48CDB', 'その他':'#91A2A0'
};
function normalizeCategory(category,name=''){
 const n=String(name||'');const c=String(category||'');
 if(c==='お菓子'||(/おやつ|お菓子|チョコ|グミ|キャンディ|飴|クッキー|スナック|アイス/.test(n)))return 'お菓子';
 if(c==='文房具'||/ノート|鉛筆|えんぴつ|ペン|消しゴム|文房具|定規|筆箱/.test(n))return '文房具';
 if(c==='遊び'||/ゲーム|おもちゃ|トレカ|カードゲーム|遊園地/.test(n))return '遊び';
 if(c==='食べ物'||/ご飯|弁当|パン|飲み物|ジュース|食事/.test(n))return '食べ物';
 return 'その他';
}
function categoryOfRecord(x){
 if(x.amount>=0)return null;
 if(x.category)return normalizeCategory(x.category,x.name);
 const match=state.transactions.find(t=>t.child===x.child&&t.type==='spend'&&t.name===x.name&&t.amount===Math.abs(x.amount)&&t.date===x.date);
 return normalizeCategory(match?.category,x.name);
}
function categoryColor(cat){return EXPENSE_CATEGORY_COLORS[cat]||EXPENSE_CATEGORY_COLORS['その他']}
function ledgerList(items){return items.length?items.map(x=>{const cat=categoryOfRecord(x),col=cat?categoryColor(cat):'#51A67C';return `<div class="item ${cat?'category-record':''}" style="--category-color:${col};--category-bg:${col}26"><div class="avatar" style="background:${col}20;color:${col}">${x.amount<0?'🛍️':'💰'}</div><div class="iteminfo"><strong>${esc(x.name)}</strong><small>${x.date} · ${x.origin==='manual'?'手入力':'自動記録'}</small>${cat?`<span class="category-badge" style="color:${col};background:${col}1A;border-color:${col}44"><span class="category-swatch" style="background:${col}"></span>${esc(cat)}</span>`:''}</div><span class="money" style="color:${col}">${x.amount>0?'+':''}${yen(x.amount)}</span></div>`}).join(''):'<div class="empty">まだ記録がありません</div>'}
function homeSavingsCards(){const active=jarsFor().filter(j=>!j.opened);return active.length?active.map(j=>`<div class="card" style="text-align:center">${jarGraphic(j)}<b>${esc(j.title)}</b><p class="muted">欲しいもの：${esc(j.want||'未設定')}</p><p class="money">${yen(j.balance)} / ${yen(j.target)}</p><div class="progress"><span style="width:${Math.min(100,100*j.balance/j.target)}%"></span></div></div>`).join(''):'<div class="empty">貯金中の貯金箱はありません</div>'}

let ledgerMonth=today().slice(0,7);function moveMonth(delta){const d=new Date(ledgerMonth+'-01T12:00:00');d.setMonth(d.getMonth()+delta);const next=fmtDate(d).slice(0,7);const earliest=[today(),...state.ledger.filter(x=>x.child===getChild().id).map(x=>x.date),...state.movements.filter(x=>x.child===getChild().id).map(x=>x.date)].sort()[0].slice(0,7);if(next>=earliest&&next<=today().slice(0,7)){ledgerMonth=next;render()}}function monthNav(){const [y,m]=ledgerMonth.split('-');return `<div class="month-select"><button data-month="-1" aria-label="前の月">‹</button><span><small>${y}年</small><b>${Number(m)}月</b></span><button data-month="1" aria-label="次の月" ${ledgerMonth>=today().slice(0,7)?'disabled':''}>›</button></div>`}function switchStrip(label,attr,prev,next){return `<div class="page-switch"><button ${attr}="${prev}" aria-label="前の表示">‹</button><b>${label}</b><button ${attr}="${next}" aria-label="次の表示">›</button></div>`}function pieSummary(){const ch=getChild();let saved=jarsFor().filter(j=>!j.opened).reduce((a,j)=>a+j.balance,0),remaining=ch.balance;const spent=state.transactions.filter(x=>x.child===ch.id&&x.type==='spend'&&x.date.slice(0,7)===ledgerMonth).reduce((a,x)=>a+x.amount,0);for(const m of state.movements.filter(x=>x.child===ch.id&&x.date.slice(0,7)>ledgerMonth)){if(m.kind==='income')remaining-=m.amount;else if(m.kind==='spend')remaining+=m.amount;else if(m.kind==='save'){if(m.detail!=='自動貯金')remaining+=m.amount;saved-=m.amount}else if(m.kind==='withdraw'){remaining-=m.amount;saved+=m.amount}}remaining=Math.max(0,remaining);saved=Math.max(0,saved);const total=spent+remaining+saved;const entries=[['使ったお金',spent,'#E98B6D'],['のこりのお金',remaining,'#51A980'],['貯金箱',saved,'#E6C36B']];let pos=0;const colors=entries.map(([n,v,c])=>{const a=pos;pos+=total?v/total*100:0;return `${c} ${a}% ${pos}%`});return `<div class="paper-chart"><div class="pie" role="img" aria-label="${entries.map(([n,v])=>n+yen(v)).join('、')}" style="background:${total?`conic-gradient(${colors.join(',')})`:'#e5e7df'}"><div class="pie-inner"><b>${yen(total)}</b></div></div><div class="chart-legend">${entries.map(([n,v,c])=>`<div><span class="dot" style="background:${c}"></span><span>${n}</span><b>${yen(v)}</b></div>`).join('')}</div><p class="muted chart-foot">${ledgerMonth===today().slice(0,7)?'今月の買い物と現在のお金':'その月の買い物と月末時点のお金（デモ記録から算出）'}</p></div>`}

function savingsPage(){if(role!=='child'){const jars=jarsFor().filter(j=>!j.opened);return `${title('貯金箱の見守り','mypage')}<div class="content"><p class="green-note">貯金箱の作成・入金・開封は子どもが行います。保護者は内容を確認できます。</p>${jars.map(j=>`<div class="card">${jarGraphic(j)}<b>${esc(j.title)}</b><p>欲しいもの：${esc(j.want||'未設定')}</p><p>${yen(j.balance)} / ${yen(j.target)}</p></div>`).join('')||'<div class="empty">貯金中のものはありません</div>'}</div>`};const active=jarsFor().filter(x=>!x.opened),past=jarsFor().filter(x=>x.opened);const pending=jarOpenStep>0?state.savings.find(x=>x.id===jarOpenId):null;return `${title('貯金箱','mypage')}<div class="content">${hero('今使えるカードのお金',getChild().balance)}<div class="card">${row('貯金中の合計',yen(active.reduce((a,j)=>a+j.balance,0)))}<p class="muted">貯金箱のお金は目標達成または開封するまで使えません。</p></div><button class="btn" data-go="jarcreate">＋ 新しい貯金缶を作る</button>${pending?`<div class="card" style="border:2px solid #e7b46c"><h3>貯金缶「${esc(pending.title)}」を開ける</h3>${jarOpenStep===1?'<p>開封すると、この貯金缶は終了してコレクションに移動します。本当に開けますか？</p>':'<p>最終確認です。'+(pending.balance<pending.target?'目標金額に達していません。':'目標達成済みです。')+'開けると貯金額がカード残高に戻ります。開けますか？</p>'}<div class="split"><button class="btn alt" id="cancelopen">やめる</button><button class="btn danger" id="nextopen">${jarOpenStep===1?'続けて確認':'開封を確定する'}</button></div></div>`:''}<div class="subhead">貯金中 (${active.length})</div>${active.map(j=>`<div class="card" style="text-align:center">${jarGraphic(j)}<b>${esc(j.title)}</b><p class="muted">欲しいもの：${esc(j.want||'未設定')}</p><p>${yen(j.balance)} / ${yen(j.target)}</p><div class="progress"><span style="width:${Math.min(100,100*j.balance/j.target)}%"></span></div>${row('おこづかい自動貯金',j.percent+'%')}<div class="field"><label>割合を変更 (0〜100%)</label><div class="split"><input id="percent-${j.id}" type="number" min="0" max="100" step="1" value="${j.percent}"/><button class="btn sm" data-percent="${j.id}">保存</button></div></div><form data-savejar="${j.id}" novalidate>${input('手動で貯金（円）','amount','number','','min="1" step="1" inputmode="numeric"')}<p class="muted">1円から${yen(Math.min(getChild().balance,j.target-j.balance))}まで貯金できます。</p><p class="form-error" data-save-error="${j.id}" hidden></p><button class="btn" type="button" data-save-action="${j.id}">貯金する</button></form><button class="btn danger" style="margin-top:9px" data-openjar="${j.id}">貯金缶を開ける</button></div>`).join('')||'<div class="empty">貯金缶はまだありません</div>'}<div class="subhead">開封済みコレクション</div><div class="jar-grid">${past.map(j=>`<div class="card">${jarGraphic(j)}<b>${esc(j.title)}</b><p class="muted">${j.success?'目標達成':'途中で開封'}</p><strong>${yen(j.balance)}</strong><div class="tag ${j.success?'':'grey'}">${j.success?'達成':'未達成'}</div></div>`).join('')||'<p class="muted">まだ開封した貯金缶はありません</p>'}</div></div>`}

function settings(){return `${title('設定')}<div class="content"><div class="card">${row('利用者モード',role==='parent'?'保護者':'子ども')}<button class="btn alt" data-switch="${role==='parent'?'child':'parent'}">${role==='parent'?'子ども':'保護者'}モードに切り替える</button></div>${role==='parent'?`<div class="card"><b>契約状態（デモ）</b><div class="field"><label>契約を切り替えて動作を確認</label><select id="subscription"><option value="trial" ${state.subscription==='trial'?'selected':''}>無料トライアル</option><option value="paid" ${state.subscription==='paid'?'selected':''}>有料契約</option><option value="cancelled" ${state.subscription==='cancelled'?'selected':''}>解約後</option></select></div><p class="muted">実際の契約変更は発生しません。</p></div><div class="card"><b>登録した子ども</b>${state.children.map(ch=>`<div class="item"><div class="iteminfo"><strong>${esc(ch.name)}さん</strong></div><span>${yen(ch.balance)}</span></div>`).join('')}<button class="btn alt" data-go="children">管理する</button></div>`:''}<div class="card"><b>このデモについて</b><p class="muted">独立した学習・機能検証用プロトタイプです。セブン銀行の公式アプリではありません。模擬金銭処理のみ対応しています。画面の完全一致は未確認です。</p></div><button class="btn danger" id="reset">デモデータを初期化</button></div>`}
const FEATURE_INFO=[{id:'budget',name:'予算管理（仮）',pain:'おこづかいを月末まで残すのが難しい',help:'自分で予算を決め、残額を確認する'},{id:'analysis',name:'支出分析・振り返り（仮）',pain:'何に使ったか分からない',help:'カテゴリーと過去の支出を振り返る'},{id:'pockets',name:'目的別資金管理（仮）',pain:'使うお金と残すお金が混ざる',help:'用途を決めてお金を整理する'},{id:'priorities',name:'買い物の優先順位整理（仮）',pain:'欲しいものが複数あって選べない',help:'価格と欲しい理由を比較する'}];

function requestFeature(id){const f=FEATURE_INFO.find(x=>x.id===id),ch=getChild();if(!f||activeFeatures().includes(id))return notify('この機能は追加済みです');if(state.featureRequests.some(r=>r.child===ch.id&&r.feature===id&&r.status==='pending'))return notify('相手の確認を待っています');state.featureRequests.unshift({id:uid(),child:ch.id,feature:id,from:role,status:'pending',date:today()});note(`${ch.name}さんの追加機能「${f.name}」の確認をお願いします` ,role==='parent'?'child':'parent',role==='parent'?ch.id:null);save();notify('相手に確認を送りました')}

function awardPoints(key,amount,reason){if(state.pointAwards.includes(key))return;state.pointAwards.push(key);state.pointsByChild[getChild().id]=(state.pointsByChild[getChild().id]||0)+amount;note(`＋${amount}ポイント：${reason}`,'child',getChild().id)}
function modulePage(){if(role!=='child')return `${title('追加機能','features')}<div class="content"><p>補助機能は子どもが操作します。保護者は機能の追加を提案・承認できます。</p></div>`;const id=state.moduleId;if(!activeFeatures().includes(id))return `${title('追加機能','features')}<div class="content">この機能はまだ追加されていません。</div>`;const ch=getChild(),items=state.transactions.filter(x=>x.child===ch.id&&x.type==='spend');const sum=items.reduce((a,x)=>a+x.amount,0);const map=state.moduleData?.[ch.id]||{};if(id==='budget')return `${title('予算管理（仮）','features')}<div class="content">${hero('現在のカード残高',ch.balance)}<div class="card">${row('自分で決めた予算',yen(map.budget||0))}${row('記録された支出の合計',yen(sum))}${row('予算までの残り',yen(Math.max(0,(map.budget||0)-sum)))}<form id="budgetform">${input('使う金額の目安（円）','budget','number',map.budget||'', 'required min="1" step="1"')}<button class="btn">自分の予算を保存</button></form></div></div>`;
if(id==='analysis'){const cats={};for(const x of items)cats[x.category||'その他']=(cats[x.category||'その他']||0)+x.amount;return `${title('支出分析（仮）','features')}<div class="content"><div class="card"><b>何に使ったかな？</b>${Object.entries(cats).map(([n,a])=>row(esc(n),yen(a))).join('')||'<p class="muted">まだ支出がありません。</p>'}</div><div class="card"><b>自分への問い</b><p>次に買い物するとき、どんなことを意識したい？</p><form id="reflectionform"><textarea name="reflection" rows="3" placeholder="自分の言葉で考えてみよう">${esc(map.reflection||'')}</textarea><button class="btn">振り返りを保存する</button></form></div></div>`}
if(id==='pockets')return `${title('目的別資金管理（仮）','features')}<div class="content"><div class="notice">これは実際のお金を移動する機能ではなく、カード残高の使い道を自分で整理するメモです。</div>${hero('カード残高',ch.balance)}<div class="card"><form id="pocketsform">${input('用途（例：遊び）','purpose','text',map.purpose||'','required maxlength="40"')}${input('取り分けたい金額（円）','amount','number',map.amount||'','required min="0" step="1"')}<button class="btn">配分メモを保存</button></form>${map.purpose?row(esc(map.purpose),yen(map.amount||0)):''}</div></div>`;
return `${title('優先順位整理（仮）','features')}<div class="content"><div class="card"><p class="muted">どちらを先に買いたいか自分で比べよう。</p><form id="prioritiesform">${input('欲しいもの A','first','text',map.first||'','required maxlength="60"')}${input('金額 A','price1','number',map.price1||'','required min="1"')}${input('欲しいもの B','second','text',map.second||'','required maxlength="60"')}${input('金額 B','price2','number',map.price2||'','required min="1"')}<div class="field"><label>どちらを優先したい？</label><select name="choice"><option value="A" ${map.choice==='A'?'selected':''}>A</option><option value="B" ${map.choice==='B'?'selected':''}>B</option></select></div><textarea name="reason" placeholder="その理由は？">${esc(map.reason||'')}</textarea><button class="btn">比較を保存する</button></form></div></div>`}
function dressPage(){const skin=walletSkinFor();return `${title('きせかえ','mypage')}<div class="content"><div class="dress-current">${walletImg(skin)}<b>今のおさいふ</b></div><div class="row"><b>おさいふを選ぶ</b><span class="tag">${state.pointsByChild[getChild().id]||0} p</span></div><div class="skin-grid">${[['classic','革財布',0],['blue','バリバリ財布',10]].map(([id,name,cost])=>`<button class="skin-choice ${skin===id?'selected':''}" data-skin="${id}" data-cost="${cost}">${walletImg(id)}<b>${name}</b><small>${skin===id?'使用中':ownedSkinsFor().includes(id)?'持っている':cost?cost+' p':'無料'}</small></button>`).join('')}</div><div class="subhead">貯金箱の見た目</div><div class="skin-grid jar-options"><div>${jarGraphic({skin:'pig',balance:1,target:1})}<b>豚の貯金箱</b></div><div>${jarGraphic({skin:'can',balance:1,target:1})}<b>缶の貯金箱</b></div></div><p class="muted">貯金箱を作るときに選べます。</p></div>`}
function myPage(){ const ch=getChild(),isChild=role==='child'; const pending=state.featureRequests.filter(r=>r.child===ch.id&&r.status==='pending'&&r.from!==role).length; if(isChild){return `${valueHead('ポイント',`${state.pointsByChild[ch.id]||0}<small> p</small>`)}<div class="content proto-content paper-mypage"><div class="subhead">カスタマイズ</div><button class="mypage-link tall" data-go="features"><span class="mypage-icon">🧩</span><span class="mypage-linktext"><strong>管理サポート</strong><small>必要な機能を親子で相談して追加・管理${pending?' · 確認待ち '+pending+'件':''}</small></span><span aria-hidden="true">›</span></button><button class="mypage-link tall" data-go="dress"><span class="mypage-icon">🎨</span><span class="mypage-linktext"><strong>きせかえ</strong><small>おさいふの見た目やポイント交換を確認する</small></span><span aria-hidden="true">›</span></button><div class="subhead">その他</div><button class="mypage-link tall" data-go="savings"><span class="mypage-icon">🐷</span><span class="mypage-linktext"><strong>貯金箱</strong><small>目標と貯まり具合を確認・管理する</small></span><span aria-hidden="true">›</span></button><p class="screen-note">機能の追加には親子両方の確認が必要です。</p></div>`} return `${title('マイページ')}<div class="content proto-content"><div class="mypoints-board"><div class="muted">見守り対象</div><div class="amount-name">${esc(ch.name)}さん</div></div><div class="subhead">管理</div><button class="mypage-link tall" data-go="features"><span class="mypage-icon">🧩</span><span class="mypage-linktext"><strong>管理サポート</strong><small>親子で機能を選ぶ${pending?' · 確認待ち '+pending+'件':''}</small></span>›</button><button class="mypage-link tall" data-go="transfer"><span class="mypage-icon">💸</span><span class="mypage-linktext"><strong>おこづかいを渡す</strong><small>子どものカードに送金する</small></span><span aria-hidden="true">›</span></button><button class="mypage-link tall" data-go="missions"><span class="mypage-icon">⭐</span><span class="mypage-linktext"><strong>おてつだいの管理</strong><small>ミッション・報酬・提案を管理する</small></span><span aria-hidden="true">›</span></button><button class="mypage-link tall" data-go="savings"><span class="mypage-icon">🏦</span><span class="mypage-linktext"><strong>貯金箱の見守り</strong><small>目標と貯まり具合を確認する</small></span><span aria-hidden="true">›</span></button><div class="subhead">その他</div><button class="mypage-link tall" data-go="children"><span class="mypage-icon">👧</span><span class="mypage-linktext"><strong>子どもを切り替える</strong><small>確認する子どもを選ぶ</small></span><span aria-hidden="true">›</span></button><button class="mypage-link tall" data-go="topup"><span class="mypage-icon">＋</span><span class="mypage-linktext"><strong>保護者のおさいふに入金</strong><small>デモ残高を補充する</small></span><span aria-hidden="true">›</span></button></div>`}
function view(){if(page==='mypage')return myPage();if(page==='home')return home();if(page==='features')return featurePage();if(page==='module')return modulePage();if(page==='dress')return dressPage();if(page==='module')return modulePage();if(page==='dress')return dressPage();if(page==='savings')return savingsPage();if(page==='jarcreate')return jarCreate();if(page==='ledger')return ledger();if(page==='missions')return missions();if(page==='missionadd')return missionadd();if(page==='proposaladd')return proposaladd();if(page==='proposals')return proposals();if(page==='watch')return watch();if(page==='children')return children();if(page==='topup'||page==='transfer'||page==='refund')return transfer(page);if(page==='card')return card();if(page==='spend')return spendpage();if(page==='notifications')return notifications();return home()}
function nav(){const items=role==='parent'?[['home','⌂','ホーム'],['ledger','▤','おこづかい帳'],['watch','♡','みまもり'],['mypage','♙','マイページ']]:[['home','⌂','ホーム'],['ledger','▤','おこづかい帳'],['missions','⭐','おてつだい'],['mypage','♙','マイページ']];const current=['features','dress','module','savings','jarcreate'].includes(page)?'mypage':(['missionadd','proposaladd','proposals'].includes(page)?'missions':page);return `<div class="nav">${items.map(([p,icon,label])=>`<button data-go="${p}" class="${current===p?'active':''}"><span class="ni">${icon}</span><b>${label}</b></button>`).join('')}</div>`}
const checklist=[['保護者/子ども切替','account'],['チャージ時の残高整合','money'],['残高不足時の拒否','money'],['カード停止中の決済拒否','card'],['カード利用通知','watch'],['自動のおこづかい帳記録','ledger'],['手入力でカード残高が不変','ledger'],['ミッション達成と報酬','mission'],['報酬の二重付与防止','mission'],['提案→承認→ミッション','proposal'],['提案却下で報酬なし','proposal'],['解約後の利用制限','subscription'],['貯金：カード残高と分離','savings'],['貯金：割合自動積立','savings'],['貯金：二重確認で途中開封','savings'],['貯金：成功・途中開封コレクション','savings'],['お金の移動：未表示の複数支出を合算','animation'],['お金の移動：一度確認した表示は再表示しない','animation'],['実機の画面とのピクセル比較','external'],['全画面/全遷移の実機確認','external']];
function render(){let app=document.getElementById('app');app.innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="orb"></span>money ring</div><div class="sub">機能検証用プロトタイプ / 非公式</div><div class="section-label">モード</div><button class="sidebtn ${role==='parent'?'active':''}" data-switch="parent"><span class="ico">👩</span>保護者モード</button><button class="sidebtn ${role==='child'?'active':''}" data-switch="child"><span class="ico">🧒</span>子どもモード</button><div class="section-label">画面外でできること</div><div class="green-note">この外側は<strong>デバッグ用</strong>です。<br>アプリのページ移動はスマホ画面の中で行います。</div><div class="section-label">デモ操作</div><button class="btn alt demo-button" id="demo-allowance">おこづかいを渡す<br><small>＋1,000円（デモ）</small></button><button class="btn alt demo-button" id="demo-spend">支払いをする<br><small>−300円（デモ）</small></button><button class="btn alt demo-button" id="demo-points">ポイントを付与<br><small>＋50 p（デモ）</small></button><div class="section-label">状態</div><span class="pill">${role==='parent'?'保護者':'子ども'}で操作中</span></aside><div class="phone"><div class="notch"></div>${!storageAvailable?'<div role="alert" style="padding:10px 15px;background:#fff1cf;color:#754a00;font-weight:700;font-size:12px">この環境ではデータを永続保存できません。操作はできますが、再読み込みすると初期化されます。</div>':''}${view()}${nav()}${moneyOverlay()}${toastText?`<div class="toast">${esc(toastText)}</div>`:''}</div><aside class="inspector"><h2>検証パネル</h2><p>操作はデモデータへ反映され、同じブラウザ内に保存されます。</p><div class="stategrid"><div class="stat"><small>${role==='parent'?'保護者のおさいふ':'カード用の模擬残高'}</small><br><strong>${role==='parent'?yen(state.parentWallet):'非表示'}</strong></div><div class="stat"><small>${esc(getChild().name)}さんのカード</small><br><strong>${yen(getChild().balance)}</strong></div></div><p>この画面で確認したい動作：</p><ul><li>表示とボタンが反応するか</li><li>操作後の状態・履歴が一致するか</li><li>権限・残高不足を正しく扱うか</li></ul><hr class="divider"><h2>実装チェック（${checklist.length}項目）</h2>${checklist.map(([n,key],i)=>`<div class="check"><div class="small">${n}</div><select data-check="${i}"><option value="unverified" ${!checks[i]||checks[i]==='unverified'?'selected':''}>未確認</option><option value="pass" ${checks[i]==='pass'?'selected':''}>合格</option><option value="fail" ${checks[i]==='fail'?'selected':''}>要修正</option><option value="na" ${checks[i]==='na'?'selected':''}>対象外</option></select></div>`).join('')}<button class="btn alt" id="exportcheck">検証結果をコピー</button><p>公開情報では全画面の一致を証明できません。外部実機確認は未確認として残します。</p></aside></div>`;wire()}
function wire(){document.getElementById('demo-allowance').onclick=()=>{if(state.parentWallet<1000)return notify('保護者のデモ残高が不足しています');role='parent';const beforeId=state.nextId;moneymove(1000,'transfer');role='child';page='home';toastText='';movementFocusId=state.movements.find(m=>m.id>beforeId&&m.child===getChild().id&&!m.seen)?.id??null;render()};document.getElementById('demo-spend').onclick=()=>{const ch=getChild();if(!ch.active)return notify('カードが停止されています');if(ch.balance<300)return notify('カード残高が不足しています');role='child';toastText='';spend('お菓子（デモ）',300,'お菓子',true)};document.getElementById('demo-points').onclick=()=>{const ch=getChild();state.pointsByChild[ch.id]=(state.pointsByChild[ch.id]||0)+50;save();role='child';page='mypage';notify('デモポイントを50 p付与しました')};document.querySelectorAll('[data-month]').forEach(el=>el.onclick=()=>moveMonth(Number(el.dataset.month)));document.querySelectorAll('[data-favorite]').forEach(el=>el.onclick=()=>{const m=state.missions.find(x=>x.id===Number(el.dataset.favorite)&&x.child===getChild().id);if(m){m.favorite=!m.favorite;save();render()}});document.querySelectorAll('[data-request]').forEach(x=>x.onclick=()=>requestFeature(x.dataset.request));document.querySelectorAll('[data-feature-approve]').forEach(x=>x.onclick=()=>respondFeature(Number(x.dataset.featureApprove),true));document.querySelectorAll('[data-feature-reject]').forEach(x=>x.onclick=()=>respondFeature(Number(x.dataset.featureReject),false));document.querySelectorAll('[data-disable]').forEach(x=>x.onclick=()=>disableFeature(x.dataset.disable));document.querySelectorAll('[data-module]').forEach(x=>x.onclick=()=>{state.moduleId=x.dataset.module;go('module')});document.querySelectorAll('[data-skin]').forEach(x=>x.onclick=()=>{const id=x.dataset.skin,cost=Number(x.dataset.cost);if(!ownedSkinsFor().includes(id)){if((state.pointsByChild[getChild().id]||0)<cost)return notify('ポイントが足りません');state.pointsByChild[getChild().id]-=cost;ownedSkinsFor().push(id)}state.walletSkinsByChild[getChild().id]=id;save();notify('おさいふを着せ替えました')});for(const name of ['budgetform','reflectionform','pocketsform','prioritiesform']){const el=document.getElementById(name);if(!el)continue;el.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(el),ch=getChild();state.moduleData[ch.id]??={};const map=state.moduleData[ch.id];if(name==='budgetform'){const n=Number(fd.get('budget'));if(!Number.isSafeInteger(n)||n<1)return notify('予算を正しく入力してください');map.budget=n;awardPoints('budget:'+ch.id,5,'初めて予算を設定')}if(name==='reflectionform'){const t=String(fd.get('reflection')||'').trim();if(t.length<5)return notify('5文字以上で振り返りを書いてください');map.reflection=t;awardPoints('reflection:'+ch.id,5,'初めて振り返りを記録')}if(name==='pocketsform'){const amount=Number(fd.get('amount'));if(!Number.isSafeInteger(amount)||amount<0||amount>ch.balance)return notify('カード残高の範囲で金額を入力してください');map.amount=amount;map.purpose=String(fd.get('purpose')||'').trim();if(!map.purpose)return notify('用途を入力してください')}if(name==='prioritiesform'){const p1=Number(fd.get('price1')),p2=Number(fd.get('price2'));if(!Number.isSafeInteger(p1)||p1<1||!Number.isSafeInteger(p2)||p2<1)return notify('正しい価格を入力してください');map.first=String(fd.get('first')||'').trim();map.second=String(fd.get('second')||'').trim();map.price1=p1;map.price2=p2;map.choice=String(fd.get('choice'));map.reason=String(fd.get('reason')||'').trim();if(!map.first||!map.second||!map.reason)return notify('欲しいものと理由を入力してください')}save();notify('保存しました')})} let mok=document.getElementById('movementok');if(mok)mok.onclick=()=>{const m=currentMovement();if(!m)return;state.movements.filter(x=>m.ids.includes(x.id)).forEach(x=>x.seen=true);movementFocusId=null;save();render()};let cancelOpen=document.getElementById('cancelopen');if(cancelOpen)cancelOpen.onclick=()=>{jarOpenId=null;jarOpenStep=0;render()};let nextOpen=document.getElementById('nextopen');if(nextOpen)nextOpen.onclick=()=>{if(jarOpenStep===1){jarOpenStep=2;render()}else openJarFinal()};document.querySelectorAll('[data-openjar]').forEach(el=>el.onclick=()=>startOpen(Number(el.dataset.openjar)));document.querySelectorAll('[data-percent]').forEach(el=>el.onclick=()=>changePercent(Number(el.dataset.percent),document.getElementById('percent-'+el.dataset.percent).value));document.querySelectorAll('[data-savejar]').forEach(el=>{const submit=()=>putJar(Number(el.dataset.savejar),new FormData(el).get('amount'));el.addEventListener('submit',e=>{e.preventDefault();submit()});el.querySelector('[data-save-action]')?.addEventListener('click',submit)});document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{tab=el.dataset.go==='ledger'?'graph':tab;go(el.dataset.go)});document.querySelectorAll('[data-switch]').forEach(el=>el.onclick=()=>setrole(el.dataset.switch));document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{tab=el.dataset.tab;render()});document.querySelectorAll('[data-mtab]').forEach(el=>el.onclick=()=>{missionTab=el.dataset.mtab;render()});document.querySelectorAll('[data-child]').forEach(el=>el.onclick=()=>{if(role!=='parent')return notify('保護者のみ子どもを選択できます');const ch=state.children.find(c=>c.id===Number(el.dataset.child));if(!ch)return notify('対象の子どもが見つかりません');state.selectedChild=ch.id;save();go('home')});document.querySelectorAll('[data-finish]').forEach(el=>el.onclick=()=>finishMission(Number(el.dataset.finish)));document.querySelectorAll('[data-judge]').forEach(el=>el.onclick=()=>{let [id,choice]=el.dataset.judge.split(':');judge(Number(id),choice==='approve')});document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{checks[el.dataset.check]=el.value;try{localStorage.setItem('moneyring-checks',JSON.stringify(checks))}catch(e){storageAvailable=false;render()}});let active=document.getElementById('cardactive');if(active)active.onchange=()=>{getChild().active=active.checked;note(`${getChild().name}さんのカードを${active.checked?'再開':'停止'}しました`,'parent');save();notify(active.checked?'カードを再開しました':'カードを停止しました')};let subscription=document.getElementById('subscription');if(subscription)subscription.onchange=()=>{state.subscription=subscription.value;save();notify('デモ契約状態を変更しました')};let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('デモのすべての操作を初期化しますか？')){state=defaults();save();go('home')}};let ra=document.getElementById('readall');if(ra)ra.onclick=()=>{state.notifications.filter(n=>n.role===role&&(role!=='child'||n.child===getChild().id||n.child==null&&n.id===1)).forEach(n=>n.read=true);save();render()};let exportcheck=document.getElementById('exportcheck');if(exportcheck)exportcheck.onclick=async()=>{let text=checklist.map(([n],i)=>`${checks[i]||'unverified'}: ${n}`).join('\n');try{await navigator.clipboard.writeText(text);notify('チェック結果をコピーしました')}catch{notify('コピーできないため手動で記録してください')}};const jarForm=document.getElementById('jarform');
if(jarForm){
  const submitJar=()=>{const b=document.getElementById('createjar-button');if(b&&b.disabled)return;if(b)b.disabled=true;try{const data=new FormData(jarForm);newJar(data.get('title'),data.get('target'),data.get('percent'),data.get('want'),data.get('skin'));}catch(err){console.error('貯金缶作成エラー',err);jarError('予期しないエラーで作成できませんでした。')}finally{if(b&&b.isConnected)b.disabled=false}};
  document.getElementById('createjar-button').addEventListener('click',submitJar);
  jarForm.addEventListener('submit',e=>{e.preventDefault();submitJar()});
}form('moneyform',fd=>{if(fd.get('mode')==='close'&&page==='transfer')notify('対面で渡すイメージの演出を行います（端末通信なし）');moneymove(fd.get('amount'),page)});form('ledgerform',fd=>{let a=Number(fd.get('amount'));if(String(fd.get('amount')).trim()===''||!Number.isSafeInteger(a)||a<=0)return notify('金額を確認してください');state.ledger.unshift({id:uid(),child:getChild().id,name:String(fd.get('name')),amount:a*(fd.get('direction')==='spend'?-1:1),date:String(fd.get('date')),origin:'manual'});save();go('ledger');notify('記録を追加しました')});form('missionform',fd=>createMission(String(fd.get('title')),String(fd.get('description')),fd.get('reward')));form('proposalform',fd=>{try{propose(String(fd.get('title')||''),String(fd.get('description')||''),fd.get('reward'),String(fd.get('deadline')||''))}catch(err){console.error('proposal submit error',err);proposalError('送信処理に失敗しました。入力内容を残したまま、もう一度お試しください。')}});form('spendform',fd=>spend(String(fd.get('name')),fd.get('amount'),String(fd.get('category'))));}
try{checks=JSON.parse(localStorage.getItem('moneyring-checks'))||{}}catch{}render();
</script></body></html>
